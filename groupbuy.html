<script>
/* 18 Coffee 外框頁：把網址上的分頁與參數（分享代號、登入碼）轉給 Apps Script 網站，自有網域顯示、沒有 Google 提示橫幅 */
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbwA8NR-gMpWQfjRnw9BbLWUyhiQqHfztBcmWNEcRsAfQ8T5FY7lIBgv0KBJswatvRa7/exec';
  var OK = { home:1, shop:1, groupbuy:1, events:1, venue:1, exhibition:1, member:1, cart:1, lookup:1, admin:1 };
  var p = (location.pathname.split('/').filter(Boolean).pop() || '').replace(/\.html$/, '');
  if (p === 'invite' || p === 'index' || !p) p = 'home';
  var q = new URLSearchParams(location.search);
  if (!q.get('page') && OK[p]) q.set('page', p);
  document.getElementById('app').src = EXEC + '?' + q.toString();
})();
</script>
